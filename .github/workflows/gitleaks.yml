# Secret scan on every push and pull request (launch gate: no key, token or signing secret may ever be committed).
# gitleaks scans the whole history; a finding fails the job and names the commit, file and rule.
name: gitleaks
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read   # the action lists the pull request's commits; without this the PR scan dies with "Resource not accessible by integration"
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
